{% extends 'base.html' %}
{% load static %}

{% block content %}
<h2 class="mb-4">Settings: Dr. Pepper</h2>

<form action="{% url 'profile' %}" method="POST">

    <div class="mb-3 row">
        <label for="loginInput" class="col-sm-2 col-form-label">Login</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" value="dr_pepper" readonly>
        </div>
    </div>

    <div class="mb-3 row">
        <label for="emailInput" class="col-sm-2 col-form-label">Email</label>
        <div class="col-sm-10">
            <input type="email" class="form-control" id="emailInput" value="dr.pepper@mail.ru">
        </div>
    </div>

    <div class="mb-3 row">
        <label for="nickInput" class="col-sm-2 col-form-label">NickName</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" id="nickInput" value="Dr. Pepper">
        </div>
    </div>

    <div class="mb-4 row">
        <label for="avatarInput" class="col-sm-2 col-form-label">Upload avatar</label>
        <div class="col-sm-10">
            <div class="mb-3">
                <img src="{% static 'img/avatar.png' %}" class="img-thumbnail" width=150px height=150px
                    alt="Current avatar">
            </div>

            <div class="mb-4 w-75">
                <input class="form-control" type="file" id="avatarInput">
            </div>

            <button type="submit" class="btn btn-success">Save</button>
        </div>
    </div>
</form>
{% endblock %}
